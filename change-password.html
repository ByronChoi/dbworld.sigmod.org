<HTML>
<HEAD>
    

<TITLE>DBWorld Change Password</TITLE>
</HEAD>
<BODY>

<H2><img src="dbworld.svg" align="center"> Change DBWorld Password</H2>

<FORM ACTION="cgi-bin/change-password.cgi"
        METHOD="POST">

<TABLE WIDTH="100%">

<TR VALIGN=MIDDLE>
<TD ALIGN=RIGHT WIDTH="30%">
Email Address </TD>
<TD ALIGN=LEFT>
<INPUT TYPE="TEXT" NAME="email" MAXLENGTH="100" SIZE="50"></TD>
</TR>

<TR VALIGN=MIDDLE>
<TD ALIGN=RIGHT WIDTH="20%">
Old password </TD>
<TD ALIGN=LEFT>
<INPUT TYPE="PASSWORD" NAME="old_password" MAXLENGTH=100 SIZE=10></TD>
</TR>

<TR VALIGN=MIDDLE>
<TD ALIGN=RIGHT WIDTH="20%">
New password </TD>
<TD ALIGN=LEFT>
<INPUT TYPE="PASSWORD" NAME="new_password" MAXLENGTH=100 SIZE=10></TD>
</TR>

<TR VALIGN=MIDDLE>
<TD ALIGN=RIGHT WIDTH="20%">
Retype new password </TD>
<TD ALIGN=LEFT>
<INPUT TYPE="PASSWORD" NAME="new_password2" MAXLENGTH=100 SIZE=10></TD>
</TR>

</TABLE>

<CENTER>
<INPUT TYPE="submit" VALUE="Change Password">
<INPUT TYPE="reset" VALUE="Reset">
</CENTER>

</FORM>

</BODY>
</HTML>
